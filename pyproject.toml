[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fly"
version = "0.1.0"
description = "Finds real flight deals departing from Belo Horizonte, in miles and cash."
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.47",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real sites"]
addopts = "-m 'not live'"
